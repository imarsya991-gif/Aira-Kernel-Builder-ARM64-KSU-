name: Build Kernel 4.4 Oldcam HMP Lavender

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout Lavender Kernel
        run: |
          git clone https://github.com/stormbreaker-project/kernel_xiaomi_lavender.git kernel
          cd kernel

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison flex libssl-dev libncurses-dev libelf-dev \
            dwarves zip curl wget git python3 ccache

      - name: Setup Clang (stable r416183b)
        run: |
          mkdir -p $HOME/clang
          cd $HOME/clang
          wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android12-release/clang-r416183b.tar.gz -O clang.tar.gz
          tar xf clang.tar.gz
          rm clang.tar.gz

      - name: Patch Kernel with xxksu
        run: |
          cd kernel
          # credit @linx3141
          curl -LSs "https://raw.githubusercontent.com/backslashxx/KernelSU/refs/heads/master/kernel/setup.sh" | bash -s master

      - name: Build Kernel
        run: |
          cd kernel
          export PATH=$HOME/clang/bin:$PATH
          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=llvm-
          export CROSS_COMPILE_ARM32=llvm-

          make O=out lavender-perf_defconfig
          make O=out -j$(nproc)

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-4.4-Lavender-Perf-HMP-xxksu
          path: |
            kernel/out/arch/arm64/boot/Image.gz
            kernel/out/arch/arm64/boot/Image.gz-dtb
            kernel/out/arch/arm64/boot/dts/qcom/*.dtb
            kernel/out/arch/arm64/boot/dts/qcom/*.dtbo
