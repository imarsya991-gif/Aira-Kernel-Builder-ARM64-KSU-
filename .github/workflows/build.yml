name: Build XPE Lavender (AOSP Clang 22)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: TheXPerienceProject/android_kernel_xiaomi_lavender
          ref: xpe-15.0
          path: kernel

      - name: Build Kernel with AOSP Clang 22
        uses: dabao1955/kernel_build_action@main
        with:
          kernel-url: TheXPerienceProject/android_kernel_xiaomi_lavender
          kernel-branch: xpe-15.0
          kernel-dir: kernel
          config: lavender_defconfig
          arch: arm64
          
          # Gunakan toolchain kustom, bukan AOSP bawaan
          aosp-gcc: true
          aosp-clang: false
          
          # Tautan unduhan langsung untuk Clang 22.0.2 (r596125) dari AOSP
          other-clang-url: https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/master/clang-r596125.tar.gz
          
          disable-lto: true
          anykernel3: true
