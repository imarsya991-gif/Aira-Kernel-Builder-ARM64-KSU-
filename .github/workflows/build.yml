name: Build XPE Lavender (LLVM 22)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: TheXPerienceProject/android_kernel_xiaomi_lavender
          ref: xpe-15.0
          path: kernel

      - name: Build Kernel with LLVM 22
        uses: dabao1955/kernel_build_action@main
        with:
          kernel-url: TheXPerienceProject/android_kernel_xiaomi_lavender
          kernel-branch: xpe-15.0
          kernel-dir: kernel
          config: lavender_defconfig
          arch: arm64
          
          # Matikan toolchain AOSP bawaan
          aosp-gcc: true
          aosp-clang: false
          
          # Menggunakan rilis resmi LLVM 22.1.2 dari GitHub
          other-clang-url: https://github.com/llvm/llvm-project/releases/download/llvmorg-22.1.2/LLVM-22.1.2-Linux-X64.tar.xz
          
          disable-lto: true
          anykernel3: true
