name: Build Kernel 4.4 Non-GKI Lavender

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Set up job
        run: echo "Starting kernel build workflow..."

      - name: Telegram: Notify build start
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TG_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TG_CHAT_ID }}" \
            -d text="🚀 Build Kernel 4.4 Lavender Non-GKI dimulai!"

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison flex libssl-dev libncurses-dev libelf-dev \
            dwarves zip curl wget git python3 ccache xz-utils \
            build-essential pkg-config libglib2.0-dev

      - name: Setup ccache
        run: |
          mkdir -p ~/.ccache
          echo "max_size = 5.0G" > ~/.ccache/ccache.conf
          ccache -M 5G

      - name: Clone kernel source
        run: |
          git clone https://github.com/stormbreaker-project/kernel_xiaomi_lavender.git kernel

      - name: Setup Clang (stable r416183b)
        run: |
          mkdir -p $HOME/clang
          cd $HOME/clang
          wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android12-release/clang-r416183b.tar.gz -O clang.tar.gz
          tar xf clang.tar.gz
          rm clang.tar.gz

      - name: Setup GCC ARM32
        run: |
          mkdir -p $HOME/gcc-arm32
          cd $HOME/gcc-arm32
          wget -q https://developer.arm.com/-/media/Files/downloads/gnu-a/10.3-2021.07/binrel/gcc-arm-10.3-2021.07-x86_64-arm-none-eabi.tar.xz -O gcc-arm32.tar.xz
          tar xf gcc-arm32.tar.xz --strip-components=1
          rm gcc-arm32.tar.xz
          ln -s $HOME/gcc-arm32/bin/arm-none-eabi-gcc $HOME/gcc-arm32/bin/arm-linux-androideabi-gcc || true
          ln -s $HOME/gcc-arm32/bin/arm-none-eabi-ld $HOME/gcc-arm32/bin/arm-linux-androideabi-ld || true

      - name: Patch KernelSU
        run: |
          cd kernel
          curl -LSs "https://raw.githubusercontent.com/backslashxx/KernelSU/refs/heads/master/kernel/setup.sh" | bash -s master

      - name: Build kernel
        run: |
          cd kernel
          export PATH=$HOME/clang/bin:$HOME/gcc-arm32/bin:$PATH
          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-android-
          export CROSS_COMPILE_ARM32=arm-linux-androideabi-
          make O=out lavender_defconfig
          make O=out -j$(nproc) | tee build.log

      - name: Package with AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git AnyKernel3
          cp kernel/out/arch/arm64/boot/Image.gz AnyKernel3/
          cp kernel/out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
          cp kernel/out/arch/arm64/boot/dts/qcom/*.dtb AnyKernel3/
          cp kernel/out/arch/arm64/boot/dts/qcom/*.dtbo AnyKernel3/
          cd AnyKernel3
          zip -r9 ../Kernel-4.4-Lavender-NonGKI-xxksu.zip *

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-4.4-Lavender-NonGKI-xxksu
          path: Kernel-4.4-Lavender-NonGKI-xxksu.zip

      - name: Upload Build Log
        uses: actions/upload-artifact@v4
        with:
          name: Build-Log
          path: kernel/build.log

      - name: Telegram: Send file
        if: success()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TG_BOT_TOKEN }}/sendDocument" \
            -F chat_id="${{ secrets.TG_CHAT_ID }}" \
            -F document=@Kernel-4.4-Lavender-NonGKI-xxksu.zip \
            -F caption="📦 Kernel 4.4 Lavender Non-GKI berhasil dibuild!"

      - name: Telegram: Notify build success
        if: success()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TG_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TG_CHAT_ID }}" \
            -d text="✅ Build Kernel 4.4 Lavender Non-GKI sukses!"

      - name: Telegram: Notify build failed
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TG_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TG_CHAT_ID }}" \
            -d text="❌ Build Kernel 4.4 Lavender Non-GKI gagal!"
