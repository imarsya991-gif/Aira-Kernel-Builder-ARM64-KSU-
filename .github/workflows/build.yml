name: Build XPE Lavender (Clang 22)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: TheXPerienceProject/android_kernel_xiaomi_lavender
          ref: xpe-15.0
          path: kernel

      - name: Build Kernel with Clang 22
        uses: dabao1955/kernel_build_action@main
        with:
          kernel-url: TheXPerienceProject/android_kernel_xiaomi_lavender
          kernel-branch: xpe-15.0
          kernel-dir: kernel
          config: lavender_defconfig   # Bisa ganti ke Yuki_defconfig jika mau
          arch: arm64
          aosp-gcc: true
          aosp-clang: true
          android-version: 14          # Android 14 (Clang 22)
          aosp-clang-version: r596125  # Clang 22.0.2
          disable-lto: true
          anykernel3: true             # Opsional: agar langsung jadi file flashable zip
