name: Build XPE Lavender (Custom Clang 22)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: TheXPerienceProject/android_kernel_xiaomi_lavender
          ref: xpe-15.0
          path: kernel

      - name: Build Kernel with Custom Clang 22
        uses: dabao1955/kernel_build_action@main
        with:
          kernel-url: TheXPerienceProject/android_kernel_xiaomi_lavender
          kernel-branch: xpe-15.0
          kernel-dir: kernel
          config: lavender_defconfig
          arch: arm64
          
          # Matikan unduhan Clang AOSP bawaan
          aosp-gcc: true
          aosp-clang: false
          
          # Gunakan Clang 22 dari ZyCromerZ (via GitHub Release)
          other-clang-url: https://github.com/ZyCromerZ/Clang/releases/download/22.0.0-20250914/Clang-22.0.0-20250914.tar.gz
          
          disable-lto: true
          anykernel3: true
