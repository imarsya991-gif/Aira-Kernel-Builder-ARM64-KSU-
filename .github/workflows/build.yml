name: Build XPE Lavender (Clang 22 Fix Werror)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: TheXPerienceProject/android_kernel_xiaomi_lavender
          ref: xpe-15.0
          path: kernel

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev libelf-dev liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3

      - name: Download Clang 22 (LLVM 22.1.2)
        run: |
          wget -q https://github.com/llvm/llvm-project/releases/download/llvmorg-22.1.2/LLVM-22.1.2-Linux-X64.tar.xz
          mkdir -p $GITHUB_WORKSPACE/clang
          tar -xf LLVM-22.1.2-Linux-X64.tar.xz -C $GITHUB_WORKSPACE/clang --strip-components=1
          echo "$GITHUB_WORKSPACE/clang/bin" >> $GITHUB_PATH

      - name: Build Kernel
        run: |
          cd kernel
          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export LLVM=1
          export LLVM_IAS=1
          
          # KUNCI PERBAIKAN: Abaikan peringatan Clang 22 agar tidak jadi Error
          export KCFLAGS="-Wno-error"

          make O=out ARCH=arm64 lavender_defconfig
          
          # Menambahkan KCFLAGS dan -k (keep going) agar build lanjut meski ada warning
          make -j$(nproc --all) O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 KCFLAGS="-Wno-error"

      - name: Package with AnyKernel3
        if: success()
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git anykernel
          cp kernel/out/arch/arm64/boot/Image.gz-dtb anykernel/ || cp kernel/out/arch/arm64/boot/Image.gz anykernel/
          cd anykernel
          zip -r ../XPE-Lavender-Clang22.zip *

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: XPE-Lavender-Clang22-Fixed
          path: XPE-Lavender-Clang22.zip
