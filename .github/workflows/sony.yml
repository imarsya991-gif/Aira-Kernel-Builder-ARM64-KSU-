name: Build Kernel Apollo 4.19

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison flex libssl-dev libncurses-dev libelf-dev dwarves zip curl wget git python3 ccache \
            lz4 device-tree-compiler gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Setup Clang
        run: |
          mkdir -p $HOME/clang
          cd $HOME/clang
          wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android13-release/clang-r450784d.tar.gz -O clang.tar.gz
          tar xf clang.tar.gz
          rm clang.tar.gz

      - name: Build Kernel
        run: |
          export PATH=$HOME/clang/bin:$PATH
          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-android-
          export CROSS_COMPILE_ARM32=arm-linux-androideabi-

          make O=out tama_apollo_defconfig
          make O=out -j8

      - name: List build output
        run: ls -lh out/arch/arm64/boot/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-Apollo-4.19
          path: |
            out/arch/arm64/boot/Image.gz
            out/arch/arm64/boot/Image.gz-dtb
            out/arch/arm64/boot/dts/qcom/*.dtb
            out/arch/arm64/boot/dts/qcom/*.dtbo
