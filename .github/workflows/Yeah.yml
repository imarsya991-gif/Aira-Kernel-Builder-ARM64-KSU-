name: 🤖 Build Android Kernel 4.4 (AOSP Clang + ReSukiSU)

on:
  workflow_dispatch:
    inputs:
      KERNEL_URL:
        description: 'URL Repository Kernel (HTTPS)'
        required: true
        type: string

      KERNEL_BRANCH:
        description: 'Branch Kernel'
        required: true
        type: string

      KERNEL_DEFCONFIG:
        description: 'Nama Defconfig (misal: lavender-perf_defconfig)'
        required: true
        type: string

      LOCALVERSION:
        description: 'Localversion tambahan (Opsional)'
        required: false
        type: string

      BUILD_USER:
        required: true
        default: "xiaomi"
        type: string

      BUILD_HOST:
        required: true
        default: "redmi"
        type: string

      USE_LTO:
        required: true
        default: "full"
        type: choice
        options:
          - none
          - thin
          - full

      ARCH:
        required: true
        default: "arm64"
        type: choice
        options:
          - arm64

env:
  KERNEL_DIR: kernel_source
  CLANG_DIR: clang
  OUT_DIR: out
  RESUKISU_DIR: resukisu

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            build-essential \
            python3 \
            curl \
            git \
            zip \
            unzip \
            wget \
            libncurses-dev \
            rsync \
            ccache \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi \
            binutils-arm-linux-gnueabi

      - name: Setup ccache
        run: |
          ccache --max-size=2G
          echo "CCACHE_DIR=$HOME/.ccache" >> $GITHUB_ENV

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ inputs.KERNEL_DEFCONFIG }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ inputs.KERNEL_DEFCONFIG }}-

      - name: Clone Kernel Source
        run: |
          git clone \
            --depth=1 \
            -b "${{ inputs.KERNEL_BRANCH }}" \
            "${{ inputs.KERNEL_URL }}" \
            "$KERNEL_DIR"

          echo "===== Kernel Source ====="
          git -C "$KERNEL_DIR" log -1 --oneline
          echo "========================"

      - name: Clone ReSukiSU Source
        run: |
          git clone \
            --depth=1 \
            https://github.com/ReSukiSU/ReSukiSU.git \
            "$RESUKISU_DIR"

          echo "===== ReSukiSU Source ====="
          git -C "$RESUKISU_DIR" log -1 --oneline
          echo "=========================="

      - name: Download & Extract AOSP Clang 11 (r383902)
        run: |
          mkdir -p "$CLANG_DIR"

          wget -q \
            https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/android11-release/clang-r383902.tar.gz

          tar -xf \
            clang-r383902.tar.gz \
            -C "$CLANG_DIR"

          rm -f clang-r383902.tar.gz

      - name: Check ReSukiSU Manual Integration
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          echo "========================================"
          echo "   CHECK RESUKISU MANUAL INTEGRATION"
          echo "========================================"

          echo ""
          echo "[1] KernelSU / ReSukiSU files:"

          find kernel fs drivers security \
            -type f \
            \( \
              -name "*ksu*" -o \
              -name "*suki*" \
            \) \
            2>/dev/null \
            | head -100 || true

          echo ""
          echo "[2] Manual hook references:"

          grep -R \
            "KSU_MANUAL_HOOK" \
            . \
            --exclude-dir=.git \
            --exclude-dir="$OUT_DIR" \
            2>/dev/null \
            | head -100 || true

          echo ""
          echo "========================================"

      - name: Fix Legacy Kernel DTC & YYLLOC Issues
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          # File DTC generated mungkin belum tersedia sebelum build.
          # Jangan hentikan workflow kalau belum ada.

          if [ -f scripts/dtc/dtc-parser.tab.c ]; then
            sed -i \
              's/^YYLTYPE yylloc;/extern YYLTYPE yylloc;/' \
              scripts/dtc/dtc-parser.tab.c
          fi

          if [ -f scripts/dtc/dtc-lexer.lex.c_shipped ]; then
            sed -i \
              's/^YYLTYPE yylloc;/extern YYLTYPE yylloc;/' \
              scripts/dtc/dtc-lexer.lex.c_shipped
          fi

      - name: Execute Defconfig
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          export PATH="$GITHUB_WORKSPACE/$CLANG_DIR/bin:$PATH"

          make \
            O=$OUT_DIR \
            ARCH=arm64 \
            CC=clang \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            ${{ inputs.KERNEL_DEFCONFIG }}

      - name: Tweak Config untuk Performa Maksimal
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          export PATH="$GITHUB_WORKSPACE/$CLANG_DIR/bin:$PATH"

          CFG="$OUT_DIR/.config"
          SCRIPT="scripts/config"

          # ============================================================
          # Optimasi compiler
          # ============================================================

          $SCRIPT \
            --file "$CFG" \
            -e CC_OPTIMIZE_FOR_PERFORMANCE_O3 || true

          $SCRIPT \
            --file "$CFG" \
            -d CC_OPTIMIZE_FOR_SIZE || true

          # ============================================================
          # Matikan overhead debug/tracing
          # ============================================================

          $SCRIPT --file "$CFG" -d DEBUG_KERNEL || true
          $SCRIPT --file "$CFG" -d DEBUG_INFO || true
          $SCRIPT --file "$CFG" -d DEBUG_FS || true
          $SCRIPT --file "$CFG" -d SCHED_DEBUG || true
          $SCRIPT --file "$CFG" -d FTRACE || true
          $SCRIPT --file "$CFG" -d KGDB || true
          $SCRIPT --file "$CFG" -d FUNCTION_TRACER || true
          $SCRIPT --file "$CFG" -d SCHEDSTATS || true

          # ============================================================
          # HMP scheduler
          # ============================================================

          $SCRIPT \
            --file "$CFG" \
            -e SCHED_HMP || true

          $SCRIPT \
            --file "$CFG" \
            -e SCHED_HMP_CSTATE_AWARE || true

          # ============================================================
          # Regenerate config
          # ============================================================

          make \
            O=$OUT_DIR \
            ARCH=arm64 \
            CC=clang \
            olddefconfig

      - name: Show Kernel Configuration
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          CFG="$OUT_DIR/.config"

          echo "========================================"
          echo "       KERNEL CONFIGURATION"
          echo "========================================"

          grep -E \
            '^(CONFIG_KSU|CONFIG_KSU_MANUAL_HOOK)' \
            "$CFG" || true

          echo "========================================"

      - name: Build Kernel
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -o pipefail

          export PATH="/usr/lib/ccache:$GITHUB_WORKSPACE/$CLANG_DIR/bin:$PATH"

          export ARCH=arm64
          export SUBARCH=arm64

          export HOSTCFLAGS="-fcommon"
          export HOSTCXXFLAGS="-fcommon"

          export KCFLAGS="-O3 -fomit-frame-pointer -fno-stack-protector -Wno-error"

          export KBUILD_BUILD_USER="${{ inputs.BUILD_USER }}"
          export KBUILD_BUILD_HOST="${{ inputs.BUILD_HOST }}"

          export CC="ccache clang"

          MAKE_ARGS="ARCH=arm64 \
          O=$OUT_DIR \
          CLANG_TRIPLE=aarch64-linux-gnu- \
          CROSS_COMPILE=aarch64-linux-gnu- \
          CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
          CONFIG_LOCALVERSION_AUTO=n"

          if [ "${{ inputs.USE_LTO }}" == "thin" ]; then
            MAKE_ARGS="$MAKE_ARGS LTO_CLANG_THIN=1"

          elif [ "${{ inputs.USE_LTO }}" == "full" ]; then
            MAKE_ARGS="$MAKE_ARGS LTO_CLANG_FULL=1"
          fi

          if [ -n "${{ inputs.LOCALVERSION }}" ]; then
            MAKE_ARGS="$MAKE_ARGS LOCALVERSION=${{ inputs.LOCALVERSION }}"
          fi

          echo "========================================"
          echo "          BUILDING KERNEL"
          echo "========================================"

          make \
            $MAKE_ARGS \
            -j$(nproc --all) \
            2>&1 | tee build.log

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ${{ env.KERNEL_DIR }}/build.log

      - name: Find Image & Prepare AnyKernel3 Zip
        id: img
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          IMAGE=$(find \
            "$PWD/$OUT_DIR/arch/arm64/boot" \
            -name "Image.gz-dtb" \
            2>/dev/null \
            | head -n1)

          if [ -z "$IMAGE" ]; then
            IMAGE=$(find \
              "$PWD/$OUT_DIR/arch/arm64/boot" \
              -name "Image.gz" \
              2>/dev/null \
              | head -n1)
          fi

          if [ -z "$IMAGE" ]; then
            IMAGE=$(find \
              "$PWD/$OUT_DIR/arch/arm64/boot" \
              -name "Image" \
              2>/dev/null \
              | head -n1)
          fi

          if [ -z "$IMAGE" ]; then
            echo "❌ Image kernel tidak ditemukan!"
            exit 1
          fi

          echo "image_path=$IMAGE" >> "$GITHUB_OUTPUT"

          echo "========================================"
          echo "Kernel Image:"
          echo "$IMAGE"
          echo "========================================"

          cd "$GITHUB_WORKSPACE"

          git clone \
            --depth=1 \
            https://github.com/osm0sis/AnyKernel3 \
            AnyKernel3

          cp "$IMAGE" AnyKernel3/

          # ============================================================
          # DTB
          # ============================================================

          DTB=$(find \
            "$GITHUB_WORKSPACE/$KERNEL_DIR/$OUT_DIR/arch/arm64/boot/dts" \
            -name "*.dtb" \
            2>/dev/null \
            | head -n1)

          if [ -n "$DTB" ]; then
            echo "DTB ditemukan: $DTB"
            cp "$DTB" AnyKernel3/dtb || true
          else
            echo "DTB tidak ditemukan."
          fi

          # ============================================================
          # DTBO
          # ============================================================

          DTBO=$(find \
            "$GITHUB_WORKSPACE/$KERNEL_DIR/$OUT_DIR/arch/arm64/boot" \
            -name "dtbo.img" \
            2>/dev/null \
            | head -n1)

          if [ -n "$DTBO" ]; then
            echo "DTBO ditemukan: $DTBO"
            cp "$DTBO" AnyKernel3/dtbo.img || true
          else
            echo "DTBO tidak ditemukan."
          fi

          # ============================================================
          # CREATE ZIP
          # ============================================================

          cd AnyKernel3

          ZIP_NAME="Kernel-${{ inputs.BUILD_USER }}-ReSukiSU-$(date +'%Y%m%d-%H%M').zip"

          zip \
            -r9 \
            "$ZIP_NAME" \
            * \
            -x ".git/*" \
            -x "README.md" \
            -x "*placeholder"

          echo "zip_path=$GITHUB_WORKSPACE/AnyKernel3/$ZIP_NAME" \
            >> "$GITHUB_OUTPUT"

          echo "zip_name=$ZIP_NAME" \
            >> "$GITHUB_OUTPUT"

          echo ""
          echo "========================================"
          echo "Flashable ZIP:"
          echo "$ZIP_NAME"
          echo "========================================"

      - name: Upload Flashable Kernel (.zip)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.img.outputs.zip_name }}
          path: ${{ steps.img.outputs.zip_path }}

      - name: Upload Raw Image File (Backup)
        uses: actions/upload-artifact@v4
        with:
          name: raw-kernel-image
          path: ${{ steps.img.outputs.image_path }}
