name: 🤖 Build Android Kernel 4.4 (AOSP Clang)

on:
  workflow_dispatch:
    inputs:
      KERNEL_URL:
        description: 'URL Repository Kernel (HTTPS)'
        required: true
        type: string
      KERNEL_BRANCH:
        description: 'Branch Kernel'
        required: true
        type: string
      KERNEL_DEFCONFIG:
        description: 'Nama Defconfig (misal: lavender-perf_defconfig)'
        required: true
        type: string
      LOCALVERSION:
        description: 'Localversion tambahan (Opsional)'
        required: false
        type: string
      BUILD_USER:
        required: true
        default: "xiaomi"
        type: string
      BUILD_HOST:
        required: true
        default: "redmi"
        type: string
      USE_KSU:
        required: true
        default: "none"
        type: choice
        options: [none, KernelSU, KernelSU-Next]
      USE_LTO:
        required: true
        default: "none"
        type: choice
        options: [none, thin, full]
      ARCH:
        required: true
        default: "arm64"
        type: choice
        options: [arm64]

env:
  KERNEL_DIR: kernel_source
  CLANG_DIR: clang
  OUT_DIR: out

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            bc bison flex libssl-dev libelf-dev \
            build-essential python3 curl git zip unzip wget \
            libncurses-dev rsync \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi binutils-arm-linux-gnueabi

      - name: Clone Kernel Source
        run: |
          git clone --depth=1 -b "${{ inputs.KERNEL_BRANCH }}" "${{ inputs.KERNEL_URL }}" "$KERNEL_DIR"

      - name: Download & Extract AOSP Clang 11 (r383902)
        run: |
          mkdir -p "$CLANG_DIR"
          wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/android11-release/clang-r383902.tar.gz
          tar -xf clang-r383902.tar.gz -C "$CLANG_DIR"
          rm clang-r383902.tar.gz

      - name: Setup KernelSU
        if: inputs.USE_KSU != 'none'
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          if [ "${{ inputs.USE_KSU }}" == "KernelSU" ]; then
            curl -LSs https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh | bash -
          else
            curl -LSs https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh | bash -s next
          fi

      - name: Fix Legacy Kernel DTC & YYLLOC Issues
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          # Fix yylloc multiple definition pada GCC 10+
          sed -i 's/^YYLTYPE yylloc;/extern YYLTYPE yylloc;/' scripts/dtc/dtc-parser.tab.c || true
          sed -i 's/^YYLTYPE yylloc;/extern YYLTYPE yylloc;/' scripts/dtc/dtc-lexer.lex.c_shipped || true

      - name: Execute Defconfig & Safe Performance Boost
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          export PATH="$GITHUB_WORKSPACE/$CLANG_DIR/bin:$PATH"
          make O=$OUT_DIR ARCH=arm64 CC=clang \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            ${{ inputs.KERNEL_DEFCONFIG }}

          # =========================================================
          # BOOST AMAN & ANTI-BOOTLOOP (ZRAM 3GB + INTERACTIVE)
          # =========================================================
          # 1. ZRAM 3GB (3072 MB)
          scripts/config --file $OUT_DIR/.config --enable CONFIG_ZRAM
          scripts/config --file $OUT_DIR/.config --set-val CONFIG_ZRAM_DEF_SIZE 3072

          # 2. CPU Governor Interactive (Responsif & Smooth)
          scripts/config --file $OUT_DIR/.config --enable CONFIG_CPU_FREQ_GOV_INTERACTIVE
          scripts/config --file $OUT_DIR/.config --enable CONFIG_CPU_FREQ_DEFAULT_GOV_INTERACTIVE

          # 3. TCP Westwood (Low-latency Network untuk Game Online)
          scripts/config --file $OUT_DIR/.config --enable CONFIG_TCP_CONG_WESTWOOD
          scripts/config --file $OUT_DIR/.config --set-str CONFIG_DEFAULT_TCP_CONG "westwood"

          # 4. Hanya mematikan debug yang aman (tidak merusak driver hardware)
          scripts/config --file $OUT_DIR/.config --disable CONFIG_FTRACE
          scripts/config --file $OUT_DIR/.config --disable CONFIG_SCHED_DEBUG
          # =========================================================

      - name: Build Kernel
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -o pipefail

          # Reset EXTRAVERSION bawaan agar string versi aman di bawah 64 karakter (Anti-Gagal Build)
          sed -i 's/^EXTRAVERSION =.*/EXTRAVERSION =/g' Makefile || true

          export PATH="$GITHUB_WORKSPACE/$CLANG_DIR/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export HOSTCFLAGS="-fcommon"
          export HOSTCXXFLAGS="-fcommon"
          export KCFLAGS="-fno-stack-protector -Wno-error"
          export KBUILD_BUILD_USER="${{ inputs.BUILD_USER }}"
          export KBUILD_BUILD_HOST="${{ inputs.BUILD_HOST }}"

          MAKE_ARGS="ARCH=arm64 \
          O=$OUT_DIR \
          CC=clang \
          CLANG_TRIPLE=aarch64-linux-gnu- \
          CROSS_COMPILE=aarch64-linux-gnu- \
          CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
          CONFIG_LOCALVERSION_AUTO=n"

          if [ "${{ inputs.USE_LTO }}" == "thin" ]; then
            MAKE_ARGS="$MAKE_ARGS LTO_CLANG_THIN=1"
          elif [ "${{ inputs.USE_LTO }}" == "full" ]; then
            MAKE_ARGS="$MAKE_ARGS LTO_CLANG_FULL=1"
          fi

          if [ -n "${{ inputs.LOCALVERSION }}" ]; then
            MAKE_ARGS="$MAKE_ARGS LOCALVERSION=${{ inputs.LOCALVERSION }}"
          fi

          make $MAKE_ARGS -j$(nproc --all) 2>&1 | tee build.log

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ${{ env.KERNEL_DIR }}/build.log

      - name: Find Image & Prepare AnyKernel3 Zip
        id: img
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          IMAGE=$(find $PWD/$OUT_DIR/arch/arm64/boot -name "Image.gz-dtb" 2>/dev/null | head -n1)

          if [ -z "$IMAGE" ]; then
            IMAGE=$(find $PWD/$OUT_DIR/arch/arm64/boot -name "Image.gz" 2>/dev/null | head -n1)
          fi

          if [ -z "$IMAGE" ]; then
            IMAGE=$(find $PWD/$OUT_DIR/arch/arm64/boot -name "Image" 2>/dev/null | head -n1)
          fi

          if [ -z "$IMAGE" ]; then
            echo "❌ Image kernel tidak ditemukan!"
            exit 1
          fi

          echo "image_path=$IMAGE" >> $GITHUB_OUTPUT
          echo "Ketemu Kernel Image: $IMAGE"

          cd $GITHUB_WORKSPACE
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 AnyKernel3
          cp "$IMAGE" AnyKernel3/

          DTB=$(find $GITHUB_WORKSPACE/$KERNEL_DIR/$OUT_DIR/arch/arm64/boot/dts -name "*.dtb" 2>/dev/null | head -n1)
          if [ -n "$DTB" ]; then
            cp "$DTB" AnyKernel3/dtb || true
          fi

          DTBO=$(find $GITHUB_WORKSPACE/$KERNEL_DIR/$OUT_DIR/arch/arm64/boot/dtbo.img 2>/dev/null | head -n1)
          if [ -n "$DTBO" ]; then
            cp "$DTBO" AnyKernel3/dtbo.img || true
          fi

          cd AnyKernel3
          ZIP_NAME="Kernel-${{ inputs.BUILD_USER }}-${{ inputs.USE_KSU }}-$(date +'%Y%m%d-%H%M').zip"
          zip -r9 "$ZIP_NAME" * -x .git README.md *placeholder
          
          echo "zip_path=$GITHUB_WORKSPACE/AnyKernel3/$ZIP_NAME" >> $GITHUB_OUTPUT
          echo "zip_name=$ZIP_NAME" >> $GITHUB_OUTPUT

      - name: Upload Flashable Kernel (.zip)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.img.outputs.zip_name }}
          path: ${{ steps.img.outputs.zip_path }}

      - name: Upload Raw Image File (Backup)
        uses: actions/upload-artifact@v4
        with:
          name: raw-kernel-image
          path: ${{ steps.img.outputs.image_path }}
