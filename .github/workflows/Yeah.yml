name: 🤖 Build Android Kernel 4.4 (OldCam Gaming Performance + ext4 Boost)

on:
  workflow_dispatch:
    inputs:
      KERNEL_URL:
        description: 'URL Repository Kernel (HTTPS)'
        required: true
        type: string

      KERNEL_BRANCH:
        description: 'Branch Kernel'
        required: true
        type: string

      KERNEL_DEFCONFIG:
        description: 'Nama Defconfig (misal: lavender-perf_defconfig)'
        required: true
        type: string

      LOCALVERSION:
        description: 'Localversion tambahan (Opsional)'
        required: false
        type: string

      BUILD_USER:
        required: true
        default: "xiaomi"
        type: string

      BUILD_HOST:
        required: true
        default: "redmi"
        type: string

      DEFAULT_HOSTNAME:
        required: true
        default: "redmi"
        type: string

      USE_LTO:
        required: true
        default: "none"
        type: choice
        options:
          - none
          - thin
          - full

      ARCH:
        required: true
        default: "arm64"
        type: choice
        options:
          - arm64

env:
  KERNEL_DIR: kernel_source
  CLANG_DIR: clang
  OUT_DIR: out

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            bc bison flex libssl-dev libelf-dev build-essential \
            python3 curl git zip unzip wget libncurses-dev rsync ccache \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi binutils-arm-linux-gnueabi

      - name: Setup ccache
        run: |
          ccache --max-size=2G
          echo "CCACHE_DIR=$HOME/.ccache" >> "$GITHUB_ENV"

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ inputs.KERNEL_DEFCONFIG }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ inputs.KERNEL_DEFCONFIG }}-

      - name: Clone Kernel Source
        run: |
          git clone \
            --depth=1 \
            -b "${{ inputs.KERNEL_BRANCH }}" \
            "${{ inputs.KERNEL_URL }}" \
            "$KERNEL_DIR"

          echo "========================================"
          echo "          KERNEL SOURCE"
          echo "========================================"
          git -C "$KERNEL_DIR" log -1 --oneline
          echo "========================================"

      - name: Setup KernelSU (backslashxx)
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          curl -LSs "https://raw.githubusercontent.com/backslashxx/KernelSU/refs/heads/master/kernel/setup.sh" | bash -s master

      - name: Fix Legacy Kernel DTC & YYLLOC Issues
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          if [ -f scripts/dtc/dtc-parser.tab.c ]; then
            sed -i 's/^YYLTYPE yylloc;/extern YYLTYPE yylloc;/' scripts/dtc/dtc-parser.tab.c
          fi
          if [ -f scripts/dtc/dtc-lexer.lex.c_shipped ]; then
            sed -i 's/^YYLTYPE yylloc;/extern YYLTYPE yylloc;/' scripts/dtc/dtc-lexer.lex.c_shipped
          fi

      - name: Download & Extract AOSP Clang 11
        run: |
          mkdir -p "$CLANG_DIR"
          wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/android11-release/clang-r383902.tar.gz
          tar -xf clang-r383902.tar.gz -C "$CLANG_DIR"
          rm -f clang-r383902.tar.gz

          echo "========================================"
          echo "          CLANG VERSION"
          echo "========================================"
          "$GITHUB_WORKSPACE/$CLANG_DIR/bin/clang" --version
          echo "========================================"

      - name: Execute Defconfig
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          export PATH="$GITHUB_WORKSPACE/$CLANG_DIR/bin:$PATH"
          make \
            O=$OUT_DIR \
            ARCH=arm64 \
            CC=clang \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            ${{ inputs.KERNEL_DEFCONFIG }}

      - name: Configure Kernel (Gaming & Thermal Optimization)
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          export PATH="$GITHUB_WORKSPACE/$CLANG_DIR/bin:$PATH"
          CFG="$OUT_DIR/.config"
          SCRIPT="scripts/config"

          echo "========================================"
          echo "      KERNEL CONFIGURATION (GAMING)"
          echo "========================================"

          # --------------------------------------------------------
          # KernelSU (xxksu, scope-minimized, no manual hook needed)
          # --------------------------------------------------------
          $SCRIPT --file "$CFG" -e CONFIG_KSU || true
          $SCRIPT --file "$CFG" -e CONFIG_KSU_TAMPER_SYSCALL_TABLE || true

          # --------------------------------------------------------
          # Optimasi Kompilator & Performa CPU High-Load
          # --------------------------------------------------------
          $SCRIPT --file "$CFG" -e CC_OPTIMIZE_FOR_PERFORMANCE_O3 || true
          $SCRIPT --file "$CFG" -d CC_OPTIMIZE_FOR_SIZE || true

          # --------------------------------------------------------
          # HMP Scheduler Tweaks (Optimasi Respons CPU untuk Game)
          # --------------------------------------------------------
          $SCRIPT --file "$CFG" -e CONFIG_SCHED_HMP || true
          $SCRIPT --file "$CFG" -e CONFIG_SCHED_HMP_CSTATE_AWARE || true
          $SCRIPT --file "$CFG" -e CONFIG_SCHED_CORE_ROTATE || true

          # --------------------------------------------------------
          # Thermal & Power Management Tweaks
          # --------------------------------------------------------
          $SCRIPT --file "$CFG" -e CONFIG_THERMAL || true
          $SCRIPT --file "$CFG" -e CONFIG_THERMAL_GOV_STEP_WISE || true
          $SCRIPT --file "$CFG" -e CONFIG_CPU_THERMAL || true

          # --------------------------------------------------------
          # Boost ext4 (Kecepatan Membaca Resource PUBG Seperti f2fs)
          # --------------------------------------------------------
          $SCRIPT --file "$CFG" -e CONFIG_EXT4_FS_POSIX_ACL || true
          $SCRIPT --file "$CFG" -e CONFIG_EXT4_FS_SECURITY || true
          $SCRIPT --file "$CFG" -e CONFIG_EXT4_ENCRYPTION || true
          $SCRIPT --file "$CFG" -e CONFIG_EXT4_FS_ENCRYPTION || true

          # I/O Scheduler Ringan & Responsif
          $SCRIPT --file "$CFG" -e CONFIG_IOSCHED_MAP || true
          $SCRIPT --file "$CFG" -e CONFIG_IOSCHED_ZEN || true
          $SCRIPT --file "$CFG" -e CONFIG_IOSCHED_FIOPS || true

          # --------------------------------------------------------
          # Disable Debugging Overhead (Meminimalisir Stutter/Lag)
          # --------------------------------------------------------
          $SCRIPT --file "$CFG" -d CONFIG_DEBUG_KERNEL || true
          $SCRIPT --file "$CFG" -d CONFIG_DEBUG_INFO || true
          $SCRIPT --file "$CFG" -d CONFIG_DEBUG_FS || true
          $SCRIPT --file "$CFG" -d CONFIG_SCHED_DEBUG || true
          $SCRIPT --file "$CFG" -d CONFIG_FTRACE || true
          $SCRIPT --file "$CFG" -d CONFIG_KGDB || true
          $SCRIPT --file "$CFG" -d CONFIG_FUNCTION_TRACER || true
          $SCRIPT --file "$CFG" -d CONFIG_SCHEDSTATS || true
          $SCRIPT --file "$CFG" -d CONFIG_SLUB_DEBUG || true
          $SCRIPT --file "$CFG" -d CONFIG_PROVE_LOCKING || true

          # --------------------------------------------------------
          # Local Version & Hostname
          # --------------------------------------------------------
          if [ -n "${{ inputs.LOCALVERSION }}" ]; then
            sed -i 's/^CONFIG_LOCALVERSION=".*"/CONFIG_LOCALVERSION="'"${{ inputs.LOCALVERSION }}"'"/' "$CFG"
            if ! grep -q "^CONFIG_LOCALVERSION=" "$CFG"; then
              echo "CONFIG_LOCALVERSION=\"${{ inputs.LOCALVERSION }}\"" >> "$CFG"
            fi
          fi

          sed -i 's/^CONFIG_DEFAULT_HOSTNAME=".*"/CONFIG_DEFAULT_HOSTNAME="'"${{ inputs.DEFAULT_HOSTNAME }}"'"/' "$CFG"
          if ! grep -q "^CONFIG_DEFAULT_HOSTNAME=" "$CFG"; then
            echo "CONFIG_DEFAULT_HOSTNAME=\"${{ inputs.DEFAULT_HOSTNAME }}\"" >> "$CFG"
          fi

          # --------------------------------------------------------
          # Regenerate Config
          # --------------------------------------------------------
          make O=$OUT_DIR ARCH=arm64 CC=clang olddefconfig

      - name: Build Kernel
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -o pipefail
          export PATH="/usr/lib/ccache:$GITHUB_WORKSPACE/$CLANG_DIR/bin:$PATH"

          export ARCH=arm64
          export SUBARCH=arm64

          export HOSTCFLAGS="-fcommon"
          export HOSTCXXFLAGS="-fcommon"

          # Flag kompilasi ekstrem (O3, omit frame pointer, fast math)
          export KCFLAGS="-O3 -fomit-frame-pointer -fno-stack-protector -ffast-math -Wno-error"

          export KBUILD_BUILD_USER="${{ inputs.BUILD_USER }}"
          export KBUILD_BUILD_HOST="${{ inputs.BUILD_HOST }}"

          export CC="ccache clang"

          MAKE_ARGS="ARCH=arm64 \
          O=$OUT_DIR \
          CLANG_TRIPLE=aarch64-linux-gnu- \
          CROSS_COMPILE=aarch64-linux-gnu- \
          CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
          CONFIG_LOCALVERSION_AUTO=n"

          if [ "${{ inputs.USE_LTO }}" == "thin" ]; then
            MAKE_ARGS="$MAKE_ARGS LTO_CLANG_THIN=1"
          elif [ "${{ inputs.USE_LTO }}" == "full" ]; then
            MAKE_ARGS="$MAKE_ARGS LTO_CLANG_FULL=1"
          fi

          echo "========================================"
          echo "          BUILDING KERNEL"
          echo "========================================"
          make $MAKE_ARGS -j$(nproc --all) 2>&1 | tee build.log

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ${{ env.KERNEL_DIR }}/build.log

      - name: Find Image & Prepare AnyKernel3 Zip
        id: img
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          IMAGE=$(find "$PWD/$OUT_DIR/arch/arm64/boot" -name "Image.gz-dtb" 2>/dev/null | head -n1)
          if [ -z "$IMAGE" ]; then
            IMAGE=$(find "$PWD/$OUT_DIR/arch/arm64/boot" -name "Image.gz" 2>/dev/null | head -n1)
          fi
          if [ -z "$IMAGE" ]; then
            IMAGE=$(find "$PWD/$OUT_DIR/arch/arm64/boot" -name "Image" 2>/dev/null | head -n1)
          fi

          if [ -z "$IMAGE" ]; then
            echo "❌ Image kernel tidak ditemukan!"
            exit 1
          fi

          echo "image_path=$IMAGE" >> "$GITHUB_OUTPUT"

          cd "$GITHUB_WORKSPACE"
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 AnyKernel3
          cp "$IMAGE" AnyKernel3/

          DTB=$(find "$GITHUB_WORKSPACE/$KERNEL_DIR/$OUT_DIR/arch/arm64/boot/dts" -name "*.dtb" 2>/dev/null | head -n1)
          if [ -n "$DTB" ]; then
            cp "$DTB" AnyKernel3/dtb || true
          fi

          DTBO=$(find "$GITHUB_WORKSPACE/$KERNEL_DIR/$OUT_DIR/arch/arm64/boot" -name "dtbo.img" 2>/dev/null | head -n1)
          if [ -n "$DTBO" ]; then
            cp "$DTBO" AnyKernel3/dtbo.img || true
          fi

          cd AnyKernel3
          ZIP_NAME="Kernel-${{ inputs.BUILD_USER }}-OldCam-PUBGGaming-$(date +'%Y%m%d-%H%M').zip"

          zip -r9 "$ZIP_NAME" * -x ".git/*" -x "README.md" -x "*placeholder"

          echo "zip_path=$GITHUB_WORKSPACE/AnyKernel3/$ZIP_NAME" >> "$GITHUB_OUTPUT"
          echo "zip_name=$ZIP_NAME" >> "$GITHUB_OUTPUT"

      - name: Upload Flashable Kernel (.zip)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.img.outputs.zip_name }}
          path: ${{ steps.img.outputs.zip_path }}

      - name: Upload Raw Image File (Backup)
        uses: actions/upload-artifact@v4
        with:
          name: raw-kernel-image
          path: ${{ steps.img.outputs.image_path }}
