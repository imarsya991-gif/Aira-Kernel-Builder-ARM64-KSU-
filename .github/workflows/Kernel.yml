name: 🛠️ Build Android Kernel

on:
  workflow_dispatch:
    inputs:
      KERNEL_URL:
        required: true
        type: string
      KERNEL_BRANCH:
        required: true
        type: string
      KERNEL_DEFCONFIG:
        required: true
        type: string
      LOCALVERSION:
        required: false
        type: string
      BUILD_USER:
        required: true
        default: "xiaomi"
        type: string
      BUILD_HOST:
        required: true
        default: "redmi"
        type: string
      USE_KSU:
        required: true
        default: "none"
        type: choice
        options: [none, KernelSU, KernelSU-Next]
      ANYKERNEL3_URL:
        required: true
        default: "https://github.com/osm0sis/AnyKernel3"
        type: string
      ANYKERNEL3_BRANCH:
        required: false
        default: "master"
        type: string
      CLANG_SOURCE:
        required: true
        default: "proton"
        type: choice
        options: [proton, aosp]
      USE_LTO:
        required: true
        default: "none"
        type: choice
        options: [none, thin, full]
      ARCH:
        required: true
        default: "arm64"
        type: choice
        options: [arm64]

env:
  KERNEL_DIR: kernel_source
  AK3_DIR: AnyKernel3
  CLANG_DIR: clang
  OUT_DIR: out

jobs:
  build:
    runs-on: ubuntu-22.04   # 🔥 WAJIB turun

    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt update
          sudo apt install -y \
            bc bison flex libssl-dev libelf-dev \
            build-essential python3 curl git zip unzip wget \
            libncurses-dev rsync \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi binutils-arm-linux-gnueabi

      - name: Clone kernel
        run: |
          git clone --depth=1 -b "${{ inputs.KERNEL_BRANCH }}" "${{ inputs.KERNEL_URL }}" "$KERNEL_DIR"

      - name: Get Proton Clang
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang "$CLANG_DIR"

      - name: Export env
        run: |
          echo "$GITHUB_WORKSPACE/$CLANG_DIR/bin" >> $GITHUB_PATH
          echo "KBUILD_BUILD_USER=${{ inputs.BUILD_USER }}" >> $GITHUB_ENV
          echo "KBUILD_BUILD_HOST=${{ inputs.BUILD_HOST }}" >> $GITHUB_ENV

      - name: Setup KernelSU
        if: inputs.USE_KSU != 'none'
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          if [ "${{ inputs.USE_KSU }}" == "KernelSU" ]; then
            curl -LSs https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh | bash -
          else
            curl -LSs https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh | bash -s next
          fi

      - name: Defconfig
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          make O=$OUT_DIR ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=0 LD=ld.lld \
            ${{ inputs.KERNEL_DEFCONFIG }}

      - name: Build
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          export PATH="$GITHUB_WORKSPACE/$CLANG_DIR/bin:$PATH"
          export HOSTCFLAGS="-fcommon"
          export KCFLAGS="-fno-stack-protector"

          MAKE_ARGS="ARCH=arm64 \
          O=$OUT_DIR \
          CC=clang \
          LLVM=1 \
          LLVM_IAS=0 \
          LD=ld.lld \
          CROSS_COMPILE=aarch64-linux-gnu- \
          CROSS_COMPILE_ARM32=arm-linux-gnueabi-"

          if [ "${{ inputs.USE_LTO }}" == "thin" ]; then
            MAKE_ARGS="$MAKE_ARGS LTO_CLANG_THIN=1"
          elif [ "${{ inputs.USE_LTO }}" == "full" ]; then
            MAKE_ARGS="$MAKE_ARGS LTO_CLANG_FULL=1"
          fi

          if [ -n "${{ inputs.LOCALVERSION }}" ]; then
            MAKE_ARGS="$MAKE_ARGS LOCALVERSION=${{ inputs.LOCALVERSION }}"
          fi

          make $MAKE_ARGS -j$(nproc) 2>&1 | tee build.log

      - name: Debug output
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          echo "Isi folder boot:"
          ls -R $OUT_DIR/arch/arm64/boot || true

      - name: Find Image
        id: img
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          IMAGE=$(find $OUT_DIR/arch/arm64/boot -name "Image*" | head -n1)
          echo "IMAGE=$IMAGE"
          echo "image_path=$IMAGE" >> $GITHUB_OUTPUT

      - name: Pack AnyKernel3
        run: |
          git clone --depth=1 "${{ inputs.ANYKERNEL3_URL }}" "$AK3_DIR"
          cp "$KERNEL_DIR/${{ steps.img.outputs.image_path }}" "$AK3_DIR/"
          cd "$AK3_DIR"
          zip -r9 ../kernel.zip .

      - uses: actions/upload-artifact@v4
        with:
          name: kernel
          path: kernel.zip
